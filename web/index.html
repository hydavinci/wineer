<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wineer · 帮你选一款白酒</title>
<link rel="icon" href="/icon.svg?v=0.5" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico?v=0.5" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=0.5">
<meta name="theme-color" content="#1a1210">
<link rel="stylesheet" href="style.css?v=0.4">
</head>
<body>
<div id="app">
  <!-- 年龄确认 -->
  <div id="ageGate" class="screen active">
    <div class="card center">
      <div class="logo">🍶 Wineer</div>
      <p class="tagline">回答几个问题，帮你选到对味的那一款白酒</p>
      <div class="age-warn">本站内容涉及酒精饮品，仅供 18 岁及以上人士浏览。<br>过量饮酒有害健康，请理性饮酒。</div>
      <button class="btn primary" onclick="Wineer.startQuiz()">我已满 18 岁，开始</button>
    </div>
  </div>

  <!-- 偏好调节 -->
  <div id="quiz" class="screen">
    <div class="card">
      <div id="questionArea"></div>
    </div>
  </div>

  <!-- 结果 -->
  <div id="result" class="screen">
    <div class="card">
      <div id="resultArea"></div>
      <button class="btn ghost" onclick="Wineer.restart()">↺ 重新选一次</button>
    </div>
  </div>
</div>

<footer>
  <p>数据为市场公开参考信息，价格随行情波动，非实时报价。请理性饮酒。</p>
  <p><a href="https://www.graymammoth.com/" target="_blank" rel="noopener">GrayMammoth</a> · Wineer 白酒推荐 v0.4</p>
</footer>

<script src="shared/recommender.js?v=0.5"></script>
<script src="app.js?v=0.5"></script>
</body>
</html>
